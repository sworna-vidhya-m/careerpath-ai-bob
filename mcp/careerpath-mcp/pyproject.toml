[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpath-mcp"
version = "0.1.0"
description = "MCP server for CareerPath AI analytics"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
careerpath-mcp = "careerpath_mcp.__main__:main"